[project]
name = "rag-project"
version = "0.1.0"
description = "Build a RAG project with LangChain, Qdrant, and OpenRouter"
authors = [
    { name = "syedincharge", email = "rizvisyeba@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.9.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "openrouter>=1.3.43",
    "pydantic>=2.12.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.1",
    "requests>=2.34.2",
    "unstructured>=0.27.25",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
